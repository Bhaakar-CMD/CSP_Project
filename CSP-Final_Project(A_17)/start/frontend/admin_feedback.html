<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Smart Irrigation</title>
  <link rel="stylesheet" href="main.css">
  <style>
    /* Scoped Admin Dashboard Styles */
    .admin-wrapper {
      max-width: 960px;
      margin: 20px auto 40px;
      padding: 0 16px;
    }

    .admin-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      background: rgba(0, 30, 15, 0.75);
      backdrop-filter: blur(8px);
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-bottom: 24px;
    }

    .admin-title-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffeb3b;
      font-size: 1.15rem;
      font-weight: bold;
    }

    .admin-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-admin {
      background: #2e7d32;
      color: #ffffff;
      border: 1px solid #81c784;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-admin:hover {
      background: #388e3c;
      transform: translateY(-1px);
    }

    .btn-admin-danger {
      background: #c62828;
      border-color: #ef9a9a;
    }

    .btn-admin-danger:hover {
      background: #d32f2f;
    }

    .btn-back {
      background: #37474f;
      border-color: #90a4ae;
      color: #ffffff;
      margin-bottom: 16px;
    }

    .btn-back:hover {
      background: #455a64;
    }

    /* Subheader & Stats */
    .dashboard-header {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 18px 24px;
      margin-bottom: 22px;
      text-align: left;
    }

    .dashboard-header h2 {
      margin: 0 0 6px 0;
      color: #ffeb3b;
      font-size: 1.45rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dashboard-header p {
      margin: 0;
      color: #e0f2f1;
      font-size: 0.95rem;
    }

    /* Users Grid */
    .users-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .user-card {
      background: rgba(255, 255, 255, 0.96);
      color: #1a2e22;
      border-radius: 12px;
      padding: 18px 20px;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      border: 2px solid transparent;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .user-card:hover {
      transform: translateY(-4px);
      border-color: #4caf50;
      box-shadow: 0 10px 24px rgba(76, 175, 80, 0.3);
      background: #ffffff;
    }

    .user-header-info {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #e8f5e9;
      color: #2e7d32;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: bold;
      border: 1px solid #c8e6c9;
      flex-shrink: 0;
    }

    .user-names {
      overflow: hidden;
    }

    .user-username {
      font-size: 1.1rem;
      font-weight: bold;
      color: #1b5e20;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-email {
      font-size: 0.85rem;
      color: #556b60;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-meta-bar {
      border-top: 1px solid #e8f0ec;
      padding-top: 10px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #607d8b;
    }

    .feedback-count-badge {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 3px 9px;
      border-radius: 12px;
      font-weight: bold;
      border: 1px solid #c8e6c9;
      font-size: 0.8rem;
    }

    .view-click-hint {
      color: #2e7d32;
      font-size: 0.85rem;
      font-weight: 700;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Selected User Details Banner */
    .selected-user-banner {
      background: rgba(255, 255, 255, 0.95);
      color: #1c2e24;
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      border-left: 6px solid #2e7d32;
      text-align: left;
    }

    .selected-user-banner h2 {
      margin: 0 0 8px 0;
      color: #1b5e20;
      font-size: 1.5rem;
    }

    .user-detail-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      font-size: 0.95rem;
      color: #37474f;
      margin-top: 8px;
    }

    .user-detail-row span b {
      color: #1b5e20;
    }

    /* Feedback Cards List */
    .feedback-list-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .feedback-card {
      background: rgba(255, 255, 255, 0.96);
      color: #1c2e24;
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      border: 1px solid #dcedc8;
      text-align: left;
      transition: transform 0.2s;
    }

    .feedback-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    }

    .feedback-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e0eae4;
      padding-bottom: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .star-rating {
      font-size: 1.15rem;
      color: #f57f17;
      font-weight: bold;
    }

    .feedback-date {
      font-size: 0.85rem;
      color: #607d8b;
    }

    .feedback-field {
      margin-bottom: 8px;
      line-height: 1.5;
      font-size: 0.96rem;
    }

    .feedback-field b {
      color: #2e7d32;
    }

    /* Empty state */
    .empty-state-card {
      background: rgba(255, 255, 255, 0.92);
      border: 2px dashed #a5d6a7;
      border-radius: 12px;
      padding: 40px 20px;
      color: #2e4d38;
      text-align: center;
      font-size: 1.1rem;
      margin: 20px 0;
    }

    .empty-state-card p {
      margin: 8px 0 0 0;
      font-weight: 600;
      color: #2e7d32;
    }

    /* Loader */
    .loading-spinner {
      font-size: 1.1rem;
      color: #a8ffb5;
      padding: 40px;
    }

    @media (max-width: 600px) {
      .users-grid {
        grid-template-columns: 1fr;
      }
      .admin-top-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .admin-actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>

  <div class="admin-wrapper">

    <!-- Top Navigation Bar -->
    <header class="admin-top-bar">
      <div class="admin-title-badge">
        🔒 <span>Admin Control Panel</span>
      </div>
      <div class="admin-actions">
        <button type="button" class="btn-admin" onclick="exportCSV()" title="Export feedbacks to CSV file">
          📥 Export as CSV
        </button>
        <button type="button" class="btn-admin btn-admin-danger" onclick="logoutAdmin()" title="Log out from admin portal">
          🚪 Logout
        </button>
      </div>
    </header>

    <!-- SECTION 1: REGISTERED USERS LIST (DEFAULT VIEW) -->
    <main id="usersSection">
      <div class="dashboard-header">
        <h2>👥 Registered Users Directory</h2>
        <p>
          Found <span id="userCount" style="font-weight:bold; color:#ffeb3b;">0</span> registered user(s). 
          Click on any user card to view their feedback submissions.
        </p>
      </div>

      <!-- Users Grid -->
      <div id="usersList" class="users-grid">
        <div class="loading-spinner">⏳ Loading registered users from database...</div>
      </div>
    </main>

    <!-- SECTION 2: SPECIFIC USER'S FEEDBACK VIEW (SWITCHABLE) -->
    <section id="userFeedbackSection" style="display: none;">
      <!-- Back Button -->
      <button type="button" class="btn-admin btn-back" id="backBtn" onclick="showUsersList()">
        ⬅️ Back to Registered Users
      </button>

      <!-- Selected User Profile Card -->
      <div class="selected-user-banner" id="selectedUserProfile">
        <h2 id="viewUserName">👤 User Feedback</h2>
        <div class="user-detail-row">
          <span><b>Email:</b> <span id="viewUserEmail">...</span></span>
          <span><b>Joined:</b> <span id="viewUserJoined">...</span></span>
          <span><b>Total Submissions:</b> <span id="viewUserCountBadge" class="feedback-count-badge">0</span></span>
        </div>
      </div>

      <!-- User Feedbacks List -->
      <div id="userFeedbackList" class="feedback-list-container">
        <div class="loading-spinner">⏳ Loading feedback for this user...</div>
      </div>
    </section>

  </div>

  <script>
    // 1. Check Admin Authentication
    const adminToken = localStorage.getItem('adminToken');
    if (!adminToken) {
      window.location.href = 'admin_login.html';
    }

    function getApiUrl(endpoint) {
      return endpoint;
    }

    let allUsers = [];
    let currentSelectedUser = null;
    let currentUserFeedbacks = [];
    let allCachedFeedbacks = [];

    // Helper to escape HTML characters safely
    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDate(raw) {
      if (!raw) return "N/A";
      try {
        const d = new Date(raw);
        if (isNaN(d.getTime())) return "N/A";
        return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
      } catch (e) {
        return "N/A";
      }
    }

    function formatDateTime(raw) {
      if (!raw) return "N/A";
      try {
        const d = new Date(raw);
        if (isNaN(d.getTime())) return "N/A";
        return d.toLocaleString();
      } catch (e) {
        return "N/A";
      }
    }

    // 2. Fetch All Registered Users
    async function loadRegisteredUsers() {
      const usersListEl = document.getElementById('usersList');
      const userCountEl = document.getElementById('userCount');

      try {
        const res = await fetch(getApiUrl('/admin/users'), {
          headers: { 'Authorization': 'Bearer ' + adminToken }
        });

        if (res.status === 401) {
          localStorage.removeItem('adminToken');
          window.location.href = 'admin_login.html';
          return;
        }

        if (!res.ok) {
          throw new Error('Failed to load registered users.');
        }

        const users = await res.json();
        allUsers = Array.isArray(users) ? users : [];
        userCountEl.textContent = allUsers.length;

        if (allUsers.length === 0) {
          usersListEl.innerHTML = `
            <div class="empty-state-card" style="grid-column: 1 / -1;">
              <p>No registered users found in the database.</p>
            </div>
          `;
          return;
        }

        usersListEl.innerHTML = allUsers.map(user => {
          const displayName = user.username || 'Farmer User';
          const displayEmail = user.email || (user.username && user.username.includes('@') ? user.username : 'Not provided');
          const joinDate = formatDate(user.createdAt);
          const fCount = user.feedbackCount || 0;
          const avatarInitial = displayName.charAt(0).toUpperCase() || 'U';

          return `
            <div class="user-card" onclick="openUserFeedback('${user._id}')" title="Click to view feedback for ${escapeHtml(displayName)}">
              <div class="user-header-info">
                <div class="user-avatar">${escapeHtml(avatarInitial)}</div>
                <div class="user-names">
                  <div class="user-username">${escapeHtml(displayName)}</div>
                  <div class="user-email">📧 ${escapeHtml(displayEmail)}</div>
                </div>
              </div>

              <div class="user-meta-bar">
                <span>📅 Joined: ${joinDate}</span>
                <span class="feedback-count-badge">💬 ${fCount} feedback(s)</span>
              </div>

              <div class="view-click-hint">
                <span>View Feedback</span> →
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Error loading users:', err);
        usersListEl.innerHTML = `
          <div class="empty-state-card" style="grid-column: 1 / -1; border-color:#e57373;">
            <p style="color:#d32f2f;">Could not load registered users. Please make sure the backend server is running.</p>
          </div>
        `;
      }
    }

    // 3. Open Specific User's Feedback Section
    async function openUserFeedback(userId) {
      const usersSection = document.getElementById('usersSection');
      const feedbackSection = document.getElementById('userFeedbackSection');
      const feedbackListEl = document.getElementById('userFeedbackList');

      usersSection.style.display = 'none';
      feedbackSection.style.display = 'block';
      feedbackListEl.innerHTML = `<div class="loading-spinner">⏳ Loading feedback for this user...</div>`;

      try {
        const res = await fetch(getApiUrl(`/admin/users/${userId}/feedback`), {
          headers: { 'Authorization': 'Bearer ' + adminToken }
        });

        if (res.status === 401) {
          localStorage.removeItem('adminToken');
          window.location.href = 'admin_login.html';
          return;
        }

        if (!res.ok) {
          throw new Error('Failed to fetch user feedback.');
        }

        const data = await res.json();
        currentSelectedUser = data.user;
        currentUserFeedbacks = data.feedbacks || [];

        // Update User Header Details
        const nameEl = document.getElementById('viewUserName');
        const emailEl = document.getElementById('viewUserEmail');
        const joinedEl = document.getElementById('viewUserJoined');
        const countBadge = document.getElementById('viewUserCountBadge');

        const userName = currentSelectedUser.username || 'User';
        const userEmail = currentSelectedUser.email || (userName.includes('@') ? userName : 'Not provided');

        nameEl.textContent = `👤 Feedback from: ${userName}`;
        emailEl.textContent = userEmail;
        joinedEl.textContent = formatDate(currentSelectedUser.createdAt);
        countBadge.textContent = `${currentUserFeedbacks.length} submitted`;

        // Render Feedback Cards or "No feedback submitted by this user yet."
        if (currentUserFeedbacks.length === 0) {
          feedbackListEl.innerHTML = `
            <div class="empty-state-card">
              <div style="font-size:2rem; margin-bottom:8px;">📝</div>
              <p>No feedback submitted by this user yet.</p>
            </div>
          `;
        } else {
          feedbackListEl.innerHTML = currentUserFeedbacks.map(f => {
            const stars = '⭐'.repeat(Math.max(1, Math.min(5, f.rating || 5)));
            return `
              <div class="feedback-card" id="fbCard_${f._id}">
                <div class="feedback-card-top">
                  <div class="star-rating">${stars} (${f.rating || 5}/5)</div>
                  <div class="feedback-date">📅 ${formatDateTime(f.createdAt)}</div>
                </div>

                ${f.like ? `<div class="feedback-field"><b>👍 What they liked:</b> ${escapeHtml(f.like)}</div>` : ''}
                ${f.improve ? `<div class="feedback-field"><b>💡 Suggestions for improvement:</b> ${escapeHtml(f.improve)}</div>` : ''}
                ${f.comments ? `<div class="feedback-field"><b>💬 Comments:</b> ${escapeHtml(f.comments)}</div>` : ''}

                <div style="margin-top: 14px; text-align: right;">
                  <button type="button" 
                          onclick="deleteFeedbackItem('${f._id}', '${userId}')" 
                          style="background:#d32f2f; color:#fff; border:none; padding:6px 14px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:0.85rem;">
                    🗑️ Delete Feedback
                  </button>
                </div>
              </div>
            `;
          }).join('');
        }

      } catch (err) {
        console.error('Error fetching user feedback:', err);
        feedbackListEl.innerHTML = `
          <div class="empty-state-card" style="border-color:#e57373;">
            <p style="color:#d32f2f;">Failed to retrieve feedback for this user.</p>
          </div>
        `;
      }
    }

    // 4. Back Button: Return to Registered Users List
    function showUsersList() {
      document.getElementById('userFeedbackSection').style.display = 'none';
      document.getElementById('usersSection').style.display = 'block';
      currentSelectedUser = null;
      currentUserFeedbacks = [];
      // Refresh user list so feedback counts reflect any deletions
      loadRegisteredUsers();
    }

    // 5. Delete Feedback Item
    async function deleteFeedbackItem(feedbackId, userId) {
      if (!confirm('Are you sure you want to delete this feedback entry?')) return;

      try {
        const res = await fetch(getApiUrl(`/feedbacks/${feedbackId}`), {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + adminToken }
        });

        if (res.ok) {
          // Reload current user's feedback
          openUserFeedback(userId);
        } else {
          alert('Failed to delete feedback entry.');
        }
      } catch (e) {
        console.error('Delete error:', e);
        alert('Server error while deleting feedback.');
      }
    }

    // 6. Export as CSV (Exports either currently opened user's feedback, or all feedbacks)
    async function exportCSV() {
      let exportData = [];

      // If viewing a specific user with feedback, export that user's feedback
      if (currentUserFeedbacks && currentUserFeedbacks.length > 0) {
        exportData = currentUserFeedbacks;
      } else {
        // Otherwise fetch all feedback from /feedbacks
        try {
          const res = await fetch(getApiUrl('/feedbacks'), {
            headers: { 'Authorization': 'Bearer ' + adminToken }
          });
          if (res.ok) {
            exportData = await res.json();
          }
        } catch (e) {
          console.error("Export fetch error:", e);
        }
      }

      if (!exportData || exportData.length === 0) {
        alert('No feedback available to export.');
        return;
      }

      const headers = ['Name', 'Email', 'Rating', 'Liked', 'Improvement', 'Comments', 'Date'];
      const rows = exportData.map(f => [
        '"' + (f.name || f.username || (currentSelectedUser ? currentSelectedUser.username : 'Anonymous')).replace(/"/g, '""') + '"',
        '"' + (f.email || (currentSelectedUser ? currentSelectedUser.email : '')).replace(/"/g, '""') + '"',
        f.rating || 5,
        '"' + (f.like || '').replace(/"/g, '""') + '"',
        '"' + (f.improve || '').replace(/"/g, '""') + '"',
        '"' + (f.comments || '').replace(/"/g, '""') + '"',
        f.createdAt ? new Date(f.createdAt).toLocaleString() : ''
      ]);

      const csvContent = headers.join(',') + '\n' + rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const filename = currentSelectedUser 
        ? `feedback_${currentSelectedUser.username.replace(/[^a-zA-Z0-9]/g, '_')}.csv` 
        : 'all_feedbacks.csv';
      
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // 7. Logout Functionality
    function logoutAdmin() {
      localStorage.removeItem('adminToken');
      window.location.href = 'admin_login.html';
    }

    // Initial Load
    loadRegisteredUsers();
  </script>
</body>
</html>
