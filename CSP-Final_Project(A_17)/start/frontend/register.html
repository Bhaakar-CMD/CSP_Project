<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Modern Irrigation Recommendation</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-nav">
    <a href="firstpage.html" class="brand-badge">
      <div class="brand-icon">🌱</div>
      <div class="brand-text">
        <h1>Modern Irrigation System</h1>
        <p>Smart Precision Agriculture</p>
      </div>
    </a>
    <div class="nav-quick-links">
      <a href="login.html">👤 Back to Login</a>
    </div>
  </header>

  <!-- Register Card Container -->
  <main class="register-container">
    <div class="register-card">

      <!-- Card Header -->
      <div class="card-header">
        <div class="icon-circle">📝</div>
        <h2>Create an Account</h2>
        <p>Join to get precision irrigation recommendations</p>
      </div>

      <!-- Alert Notification Banner -->
      <div id="alertBox" class="alert-box" role="alert">
        <span id="alertIcon">⚠️</span>
        <span id="alertText"></span>
      </div>

      <!-- Register Form -->
      <form id="registerForm" novalidate autocomplete="on">

        <!-- Username -->
        <div class="form-group">
          <label for="username">
            <span>👤</span> Username
          </label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="username" 
              name="username" 
              placeholder="Choose a unique username" 
              required 
              autocomplete="username"
            >
          </div>
        </div>

        <!-- Email (Optional/Recommended) -->
        <div class="form-group">
          <label for="email">
            <span>📧</span> Email Address (Optional)
          </label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="email" 
              name="email" 
              placeholder="e.g. farmer@example.com" 
              autocomplete="email"
            >
          </div>
        </div>

        <!-- Password with Show/Hide -->
        <div class="form-group">
          <label for="password">
            <span>🔒</span> Password
          </label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="At least 6 characters" 
              required 
              autocomplete="new-password"
            >
            <button 
              type="button" 
              id="togglePassBtn" 
              class="password-toggle-btn" 
              title="Show or hide password"
            >
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eyeOffIcon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password with Show/Hide -->
        <div class="form-group">
          <label for="confirm">
            <span>🔑</span> Confirm Password
          </label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="confirm" 
              name="confirm" 
              placeholder="Re-enter your password" 
              required 
              autocomplete="new-password"
            >
            <button 
              type="button" 
              id="toggleConfirmBtn" 
              class="password-toggle-btn" 
              title="Show or hide password"
            >
              <svg id="eyeConfirmIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eyeOffConfirmIcon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn-submit">
          <span class="btn-spinner" id="btnSpinner"></span>
          <span id="btnText">✨ Create Account</span>
        </button>

      </form>

      <!-- Divider -->
      <div class="card-divider">
        <span>Already Registered?</span>
      </div>

      <!-- Login Redirect -->
      <div class="login-redirect-section">
        <p>Already have an account? <a href="login.html">Sign In Here</a></p>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="page-footer">
    <p>💧 Modern Irrigation Recommendation &copy; Precision Agricultural Technology</p>
  </footer>

  <script>
    // Password toggles
    function setupToggle(btnId, inputId, eyeId, eyeOffId) {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      const eye = document.getElementById(eyeId);
      const eyeOff = document.getElementById(eyeOffId);
      btn.addEventListener("click", () => {
        const isPass = input.type === "password";
        input.type = isPass ? "text" : "password";
        eye.style.display = isPass ? "none" : "block";
        eyeOff.style.display = isPass ? "block" : "none";
      });
    }

    setupToggle("togglePassBtn", "password", "eyeIcon", "eyeOffIcon");
    setupToggle("toggleConfirmBtn", "confirm", "eyeConfirmIcon", "eyeOffConfirmIcon");

    // Alert helper
    const alertBox = document.getElementById("alertBox");
    const alertText = document.getElementById("alertText");
    const alertIcon = document.getElementById("alertIcon");

    function showAlert(type, msg) {
      alertBox.className = "alert-box show " + type;
      alertText.textContent = msg;
      alertIcon.textContent = (type === "success") ? "✅" : "❌";
    }

    // Submit handler
    const form = document.getElementById("registerForm");
    const submitBtn = document.getElementById("submitBtn");
    const btnSpinner = document.getElementById("btnSpinner");
    const btnText = document.getElementById("btnText");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.className = "alert-box";

      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (!username || !password || !confirm) {
        showAlert("error", "Please fill in all required fields.");
        return;
      }

      if (password.length < 6) {
        showAlert("error", "Password must be at least 6 characters long.");
        return;
      }

      if (password !== confirm) {
        showAlert("error", "Passwords do not match. Please verify.");
        return;
      }

      submitBtn.disabled = true;
      btnSpinner.style.display = "inline-block";
      btnText.textContent = "Creating Account...";

      try {
        const response = await fetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, password, confirm })
        });

        const result = await response.json();

        if (response.ok) {
          showAlert("success", (result.message || "Registration successful!") + " Redirecting to login...");
          setTimeout(() => {
            window.location.href = `login.html?registered=1&user=${encodeURIComponent(username)}`;
          }, 1200);
        } else {
          submitBtn.disabled = false;
          btnSpinner.style.display = "none";
          btnText.textContent = "✨ Create Account";
          showAlert("error", result.message || "Registration failed.");
        }
      } catch (err) {
        submitBtn.disabled = false;
        btnSpinner.style.display = "none";
        btnText.textContent = "✨ Create Account";
        console.error("Register error:", err);
        showAlert("error", "Could not connect to the server. Please try again.");
      }
    });
  </script>

</body>
</html>
